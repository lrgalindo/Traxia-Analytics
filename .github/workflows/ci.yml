name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # ── Job 1: pgTAP isolation tests ─────────────────────────────────────────────
  # Uses the custom postgres image (docker/postgres/Dockerfile) that bundles
  # pgTAP + schema + seed data.  Requires the image to be published to a
  # registry before this job can run in GitHub Actions — skipped until then.
  pgtap:
    name: pgTAP isolation tests
    runs-on: ubuntu-latest
    continue-on-error: true   # image not yet in a registry; non-blocking
    services:
      postgres:
        image: traxia-analytics-postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traxia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run pgTAP isolation suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traxia
        run: bash tests/run_tests.sh

  # ── Job 2: pytest (cloud + edge) ─────────────────────────────────────────────
  # Builds the custom postgres image (docker/postgres/Dockerfile — postgres:17
  # with pg_partman + pgTAP) on the runner so migrations succeed without a
  # pre-published image in a registry.
  pytest:
    name: pytest unit/integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build custom postgres image
        run: docker build -t traxia-analytics-postgres docker/postgres/

      - name: Start postgres container
        run: |
          docker run -d --name pg \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=traxia \
            -e POSTGRES_USER=postgres \
            -p 5432:5432 \
            traxia-analytics-postgres
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d traxia && break || sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traxia
        run: python3 -m alembic upgrade head

      - name: Run cloud tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traxia
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RTSP_ENCRYPTION_KEY: ${{ secrets.RTSP_ENCRYPTION_KEY }}
          PLATFORM_ADMIN_SECRET: ${{ secrets.PLATFORM_ADMIN_SECRET }}
          ANTHROPIC_API_KEY: "sk-test"  # non-empty so copilot 503 guard passes; client is mocked in tests
        run: pytest tests/ -v --ignore=tests/e2e -x

      - name: Run edge tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RTSP_ENCRYPTION_KEY: ${{ secrets.RTSP_ENCRYPTION_KEY }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traxia
        run: pytest edge/tests/ -v -x

  # ── Job 3: E2E smoke test (docker-compose) ────────────────────────────────────
  # Requires docker-compose.e2e.yml to build the custom postgres image locally.
  # Non-blocking until the compose stack is validated on GHA runners.
  e2e:
    name: E2E smoke test (docker-compose)
    runs-on: ubuntu-latest
    continue-on-error: true   # docker-compose stack needs custom image build
    steps:
      - uses: actions/checkout@v4

      - name: Build E2E stack
        run: docker-compose -f docker-compose.e2e.yml build

      - name: Start E2E stack
        env:
          ANTHROPIC_API_KEY: ""   # skip copilot/audit items in CI unless key provided
        run: docker-compose -f docker-compose.e2e.yml up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Run E2E smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/traxia
          JWT_SECRET: e2e-smoke-test-secret-2026
          RTSP_ENCRYPTION_KEY: "eH0I7ppuNWkf394Y2143HGgWpkWhGr45Gwyj1DEvd_4="
        run: python3 tests/e2e/smoke_test.py

      - name: Collect logs on failure
        if: failure()
        run: docker-compose -f docker-compose.e2e.yml logs --tail=100

      - name: Stop E2E stack
        if: always()
        run: docker-compose -f docker-compose.e2e.yml down -v

  # ── Job 4: Playwright (dashboard) ────────────────────────────────────────────
  playwright:
    name: Playwright E2E (dashboard)
    runs-on: ubuntu-latest
    continue-on-error: true   # dashboard Playwright tests pending setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: dashboard
        run: npx playwright test

  # ── Job 5: deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: [pytest]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -f -s -X POST \
            "https://api.render.com/v1/services/srv-d9f8qgrtqb8s738t8fjg/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
